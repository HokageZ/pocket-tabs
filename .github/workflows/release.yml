name: Build and release

# Every push and pull request: run the tests and build the .vsix (downloadable from the run).
# Pushing a tag like v1.2.0: also publish a GitHub release with the .vsix attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce@3 package --no-dependencies --out "pocket-tabs-$version.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "Pocket Tabs $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install: download the .vsix below, then run \`code --install-extension pocket-tabs-${GITHUB_REF_NAME#v}.vsix\` (or in VS Code: Extensions view → ⋯ → Install from VSIX…)."
