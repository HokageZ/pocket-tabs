<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Tabs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pocket Tabs</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Sign in -->
<section id="login" class="view login" hidden>
  <div class="login-card">
    <img src="/icon.svg" alt="" width="64" height="64">
    <h1>Connect to your PC</h1>
    <p>In VS Code, tap the <b>phone icon</b> in the status bar (or run <b>Pocket Tabs: Show Phone QR Code</b>) and scan the QR code. You can also type the access code shown there.</p>
    <form id="login-form" autocomplete="off">
      <input id="code-input" name="code" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" aria-label="Access code">
      <button id="login-btn" type="submit">Connect</button>
    </form>
    <p id="login-err" class="err" role="alert"></p>
  </div>
</section>

<!-- Home: notes and tabs -->
<section id="home" class="view home" hidden>
  <header class="home-head">
    <div class="home-top">
      <div class="brand"><img src="/icon.svg" alt="" width="22" height="22"><span>Pocket Tabs</span></div>
      <div id="conn" class="conn" data-state="off"><i></i><span>Connecting</span></div>
    </div>
    <h1 id="home-title" class="home-title">Notes</h1>
    <label class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Search open notes" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Search">
    </label>
    <div class="seg" role="tablist" aria-label="Show">
      <button type="button" role="tab" data-seg="notes" aria-selected="true">Notes</button>
      <button type="button" role="tab" data-seg="all" aria-selected="false">All tabs</button>
      <button type="button" role="tab" data-seg="files" aria-selected="false">Files</button>
    </div>
  </header>
  <main id="home-list" class="home-list" aria-live="polite"></main>
</section>

<!-- Note / file -->
<section id="note" class="view note" hidden>
  <header class="note-bar">
    <button id="back" class="icon-btn" type="button" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="note-head">
      <div id="note-title" class="note-title"></div>
      <div class="note-sub"><span id="note-path" class="note-path"></span><span id="sync" class="sync" data-state="busy">Loading…</span></div>
    </div>
    <button id="blame-btn" class="icon-btn" type="button" aria-label="Show who changed each line" aria-pressed="false">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v5.8M12 15.2V21"/><path d="M4 6h2M4 12h2M4 18h2" opacity=".55"/></svg>
    </button>
    <button id="save" class="save-btn" type="button" data-state="saved" hidden>
      <svg class="ic-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      <span>Saved</span>
    </button>
    <button id="more" class="icon-btn" type="button" aria-label="Options">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
    </button>
  </header>
  <div id="edits" class="edits" hidden aria-label="Latest edits"></div>
  <div id="banner" class="banner" hidden></div>
  <div id="cm-host" class="cm-host"></div>
  <div id="pop" class="pop" hidden role="status">
    <i class="pop-dot"></i>
    <div class="pop-text"><div id="pop-title" class="pop-title"></div><div id="pop-sub" class="pop-sub"></div></div>
  </div>
  <footer id="toolbar" class="toolbar" hidden>
    <div id="keys" class="keys" role="toolbar" aria-label="Formatting"></div>
  </footer>
</section>

<!-- Options sheet -->
<div id="backdrop" class="backdrop"></div>
<div id="sheet" class="sheet" role="dialog" aria-label="Note options" aria-hidden="true">
  <div class="grip"></div>
  <div class="sheet-head">
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-stats" class="sheet-stats"></div>
  </div>
  <div id="mode-seg" class="seg seg-wide" role="tablist" aria-label="View"></div>
  <div class="group">
    <label class="row">
      <span><b>Auto-save</b><small>Save to disk a moment after you stop typing. Off: use the Save button</small></span>
      <input type="checkbox" id="opt-autosave" class="switch">
    </label>
    <label class="row">
      <span><b>Edit markers</b><small>Color bar next to lines changed this session: violet for phone, blue for PC</small></span>
      <input type="checkbox" id="opt-markers" class="switch">
    </label>
    <label class="row md-only">
      <span><b>Readable line length</b><small>Keep lines comfortable on tablets</small></span>
      <input type="checkbox" id="opt-readable" class="switch">
    </label>
    <label class="row code-only">
      <span><b>Word wrap</b></span>
      <input type="checkbox" id="opt-wrap" class="switch">
    </label>
    <label class="row code-only">
      <span><b>Line numbers</b></span>
      <input type="checkbox" id="opt-lines" class="switch">
    </label>
    <div class="row">
      <span><b>Text size</b></span>
      <div class="stepper">
        <button type="button" id="font-dec" aria-label="Smaller text">A−</button>
        <span id="font-val">16</span>
        <button type="button" id="font-inc" aria-label="Larger text">A+</button>
      </div>
    </div>
  </div>
  <div class="group">
    <button type="button" class="row action" id="act-reveal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Show in VS Code on the PC</span>
    </button>
    <button type="button" class="row action" id="act-close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m9.5 10 5 5M14.5 10l-5 5"/></svg>
      <span>Close this tab on the PC</span>
    </button>
    <button type="button" class="row action" id="act-reload">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Reload from the PC</span>
    </button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="/sync.js"></script>
<script src="/editor.js"></script>
<script src="/app.js"></script>
</body>
</html>
